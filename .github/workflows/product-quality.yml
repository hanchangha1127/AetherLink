name: Product quality (non-security subset)

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: >-
    product-quality-${{ github.workflow }}-${{
    github.event_name == 'pull_request' &&
    github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  macos-product-quality:
    name: macOS product quality subset
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Report toolchain
        run: |
          xcodebuild -version
          python3 --version
          ruby --version
          swift --version
      - name: Check changed bytes
        env:
          BASE_SHA: >-
            ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          elif git rev-parse "$HEAD_SHA^" >/dev/null 2>&1; then
            git diff --check "$HEAD_SHA^" "$HEAD_SHA"
          else
            git show --check --format= "$HEAD_SHA"
          fi
      - name: Validate bounded CI contract
        run: |
          python3 -B script/check_product_ci.py
          python3 -B script/check_product_ci.py --self-test
      - name: Run product static checks
        run: |
          python3 -B script/check_copy_hygiene.py --product-copy-only
          python3 -B script/check_release_version_ledger.py
          python3 -B script/check_app_icons.py
          python3 -B script/check_license.py
      - name: Run tracked documentation contracts
        run: |
          python3 -B script/check_docs_hygiene.py --tracked-contracts-only
          python3 -B -m unittest \
            script.test_documentation_handoff_guards.DocumentationHandoffGuardTests.test_tracked_document_contract_mode_excludes_ignored_evidence_readback \
            script.test_documentation_handoff_guards.DocumentationHandoffGuardTests.test_tracked_document_contract_cli_is_explicit_and_bounded
      - name: Run macOS release package contract units
        run: PYTHONPATH=. python3 -B script/test_build_and_run.py
      - name: Compile macOS app
        run: swift build --product AetherLink
      - name: Verify focused Swift test selection
        run: |
          swift test list > .build/aetherlink-product-ci-swift-test-list-v1.txt
          python3 -B script/check_product_ci.py --swift-test-selection
          python3 -B script/check_product_ci.py --prepare-swift-focused-test-run
      - name: Run focused product units
        run: >-
          python3 -B script/check_product_ci.py
          --run-swift-focused-tests
          --swift-focused-filter
          'DocumentIngestorTests|DocumentTextExtractorTests|DocumentChunkerTests|AggregatingLlmBackendResidencyTests|ProviderHealthRecoveryTests|RuntimeModelIdleUnloadPolicyTests|RuntimeChatContextCompactionPlannerTests|RuntimeSemanticChatSessionSearchTests|RuntimeSemanticMemorySearchTests|AppLifecycleTests|LocalRuntimeMessageRouterTests/testApplicationTerminationRejectsNewRequestsAndDrainsRetiringTasks|LocalRuntimeMessageRouterTests/testApplicationTerminationDrainsRequestBlockedDuringRegistration|LocalRuntimeMessageRouterTests/testApplicationTerminationWaitsForChatTitleCancellationDispatch|LocalRuntimeMessageRouterTests/testApplicationTerminationWaitsForMemorySummaryCancellationDispatch|LocalRuntimeMessageRouterTests/testApplicationTerminationWaitsForDeferredSummaryPublicationAndPersistence|LocalRuntimeMessageRouterTests/testApplicationTerminationDrainsFailedDeferredSummaryPublicationWithoutPersistence|LocalRuntimeMessageRouterTests/testMemorySummaryDraftGeneratePublishesBeforeBlockingDurableCache|LocalRuntimeMessageRouterTests/testCompanionAppModelTerminationCancelsAndDrainsRuntimeChatRetentionMaintenance|OllamaBackendHealthTimeoutTests/testHealthCheckUsesFiveSecondsWhileCatalogRetainsSixtySeconds|LMStudioBackendHealthTimeoutTests/testHealthCheckUsesFiveSecondsWhileCatalogRetainsSixtySeconds|BonjourAdvertiserTests|LocalPeerServerTests/testLocalPeerServerReportsListenerStartAndExplicitStop|LocalPeerServerTests/testLocalPeerServerOccupiedPortFailsThenSameInstanceRetries|LocalPeerServerTests/testPeerAdmissionCannotCrossListenerStopGenerationBoundary|MacRuntimeConnectionManagerTests/testStartLocalDefersAdvertisementUntilListenerIsReady|MacRuntimeConnectionManagerTests/testStartLocalDefersReadyUntilAdvertisementIsPublished|MacRuntimeConnectionManagerTests/testAsyncListenerReadyForwardsImmediateAdvertisementFailure|MacRuntimeConnectionManagerTests/testAdvertisementFailureAllowsSamePortRetryAndIgnoresStaleSuccess|MacRuntimeConnectionManagerTests/testRefreshWhileAdvertisementPublishesUsesLatestMetadataOnly|MacRuntimeConnectionManagerTests/testUnexpectedAdvertisementStopClearsFalseReadyOwnership|MacRuntimeConnectionManagerTests/testConcreteLocalListenerDefersAdvertisementAndRetriesAfterOccupiedPort|MacRuntimeConnectionManagerTests/testUnexpectedLocalPortCannotRemainStartingOrAdvertising|MacRuntimeConnectionManagerTests/testLateLocalFailureStopsOwnershipAndReportsStatus|MacRuntimeConnectionManagerTests/testSupersededLocalStatusCallbackCannotStopReplacement|MacRuntimeConnectionManagerTests/testStoppedLocalStatusCallbackIsIgnoredAfterExplicitStop|MacRuntimeConnectionManagerTests/testStopAllStopsLocalAdvertiserBootstrapAndPairsExactlyOnce|LocalRuntimeMessageRouterTests/testCompanionAppModelSuspendsAndResumesActiveRuntimeOnceAtSamePort|LocalRuntimeMessageRouterTests/testCompanionAppModelSuspendsStartingRuntimeAndIgnoresPreSleepCallbacks|LocalRuntimeMessageRouterTests/testCompanionAppModelDoesNotResumeStoppedOrFailedRuntimeAfterSystemWake|LocalRuntimeMessageRouterTests/testCompanionAppModelStartsReplaceableTransportAndStopsIt|LocalRuntimeMessageRouterTests/testCompanionAppModelUserInterfaceStartCanRetryAfterListenerFailure|LocalRuntimeMessageRouterTests/testCompanionAppModelCanRetryAfterBonjourPublicationFailure|LocalRuntimeMessageRouterTests/testCompanionAppModelLateListenerFailureAllowsSamePortRetryAndIgnoresStaleCallback|LocalRuntimeMessageRouterTests/testCompanionAppModelPortReplacementShowsStartingUntilReady|LocalRuntimeMessageRouterTests/testCompanionAppModelUserInterfaceStartIsIdempotentDuringRouteAllocation|LocalRuntimeMessageRouterTests/testCompanionAppModelDebugUserInterfaceDoesNotGenerateQRCodeWhenRuntimeListenerFails|LocalRuntimeMessageRouterTests/testCompanionAppModelBeginLocalPairingWaitsForListenerReadiness|LocalRuntimeMessageRouterTests/testCompanionAppModelPairingWaitsForBonjourPublication|LocalRuntimeMessageRouterTests/testCompanionAppModelReportsFailedTransportWithoutAdvertising|PairingRouteNoticeTests/testRuntimeStartingUsesNeutralReadinessNotice|AetherLinkLocalizationTests/testStatusOverviewMapsEachFocusToOnePrimaryAction|AetherLinkLocalizationTests/testStatusOverviewRuntimeStartAndRetryActionsUseSelectedLanguage|AetherLinkLocalizationTests/testShortTransitionAnimationHonorsReducedMotion|AetherLinkLocalizationTests/testVisualAccessibilityOverridesCannotDisableSystemPreferences|AetherLinkLocalizationTests/testIncreasedContrastStatusPaletteAndSurfacesRemainLegible|AetherLinkLocalizationTests/testRuntimeHistorySelectionUsesNonColorMarkerAndReconcilesKeyboardList|AetherLinkLocalizationTests/testConnectionRecoveryExpansionTargetsFirstEditableField|AetherLinkLocalizationTests/testPairingDestinationFocusPlanSeparatesKeyboardAndVoiceOverTargets|AetherLinkLocalizationTests/testRuntimeTranscriptReasoningUsesFullOpacityAtIncreasedContrast|AccessibilityAnnouncementTests/testPairingQRExpiryAnnouncementFiresOnceWithoutCountdownSpam|AetherLinkRenderSmokeTests/testRuntimeOverviewPrimaryActionFitsCompactAccessibilityLayoutAcrossLanguages|AetherLinkRenderSmokeTests/testReducedMotionStatusAndActivePairingSurfacesRender|AetherLinkRenderSmokeTests/testIncreasedContrastAndColorIndependentHistorySurfacesRender'
      - name: Bind and verify focused Swift test results
        run: |
          python3 -B script/check_product_ci.py --write-swift-focused-test-binding
          python3 -B script/check_product_ci.py --swift-focused-test-results
      - name: Build unsealed macOS Release package on main
        if: >-
          ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' }}
        run: |
          source_before="$(python3 -B script/package_release_artifacts.py source-digest)"
          ./script/build_and_run.sh --unsealed-package-only
          source_after="$(python3 -B script/package_release_artifacts.py source-digest)"
          if [[ "$source_before" != "$source_after" ]]; then
            echo "macOS Release build inputs changed during packaging" >&2
            exit 2
          fi
      - name: Read back unsealed macOS Release package on main
        if: >-
          ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' }}
        run: >-
          python3 -B script/check_release_artifact_archive.py
          --macos-build-outputs

  android-product-quality:
    name: Android product quality subset
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Verify Android toolchain
        run: |
          java -version
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          ./gradlew --version
      - name: Run release archive contract units
        run: PYTHONPATH=. python3 -B script/test_release_artifact_archive.py
      - name: Compile Android and run focused product units
        run: >-
          ./gradlew
          --no-daemon
          --console=plain
          -Pkotlin.incremental=false
          :app:compileDebugKotlin
          :app:compileDebugUnitTestKotlin
          :app:testDebugUnitTest
          --tests com.localagentbridge.android.AetherLinkThemeNoDeviceComposeTest
          --tests com.localagentbridge.android.ResearchNotebookDrawerTest
          --tests com.localagentbridge.android.runtime.RuntimeAttachmentPromptResourceTest
          --tests com.localagentbridge.android.AppNavigationTest.androidAppLocaleOverrideSyncDistinguishesExplicitEnglishFromFollowSystem
          --tests com.localagentbridge.android.runtime.RuntimeLocalStoreTest.androidPlatformLanguageSnapshotUsesApi33OverrideAndPreservesLegacyExplicitChoice
          --tests com.localagentbridge.android.runtime.RuntimeClientViewModelTest.viewModelReconcilesAuthoritativeAndroidAppLanguageSnapshotWithoutDuplicateSaves
          --tests com.localagentbridge.android.AndroidAppLanguagePlatformLifecycleTest
          --tests com.localagentbridge.android.ui.AndroidCoreSurfaceFontScaleQualificationTest
          --tests com.localagentbridge.android.PairingQrScannerChromeNoDeviceComposeTest
          --tests com.localagentbridge.android.PairingQrCameraPermissionControllerHostApiMatrixTest
          --tests com.localagentbridge.android.PairingQrCameraPermissionActivityRecreationTest
          --tests com.localagentbridge.android.ui.ClientScreensNoDeviceComposeTest.chatScreenSessionBoundaryResetsLatestWhileSameSessionUpdatesKeepPosition
      - name: Verify focused Android test results
        run: python3 -B script/check_product_ci.py --android-test-results
      - name: Prepare complete Android app units on main
        if: >-
          ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' }}
        run: >-
          python3 -B script/check_product_ci.py
          --prepare-android-full-test-run
      - name: Run complete Android app units on main
        if: >-
          ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' }}
        run: >-
          ./gradlew
          --no-daemon
          --console=plain
          --rerun-tasks
          -Pkotlin.incremental=false
          :app:compileDebugKotlin
          :app:testDebugUnitTest
          --tests com.localagentbridge.android.AppNavigationTest
          --tests com.localagentbridge.android.AndroidAppLanguagePlatformLifecycleTest
          --tests com.localagentbridge.android.ResearchNotebookDrawerTest
          --tests com.localagentbridge.android.PairingQrScanResultTest
          --tests com.localagentbridge.android.AetherLinkThemeNoDeviceComposeTest
          --tests com.localagentbridge.android.ui.AndroidCoreSurfaceFontScaleQualificationTest
          --tests com.localagentbridge.android.PairingQrScannerChromeNoDeviceComposeTest
          --tests com.localagentbridge.android.PairingQrCameraPermissionControllerHostApiMatrixTest
          --tests com.localagentbridge.android.PairingQrCameraPermissionActivityRecreationTest
          --tests com.localagentbridge.android.ui.ClientScreensNoDeviceComposeTest
          --tests com.localagentbridge.android.AndroidBackupPolicyResourceTest
          --tests com.localagentbridge.android.runtime.RuntimeClientViewModelRelayIntegrationTest
          --tests com.localagentbridge.android.runtime.RuntimeClientViewModelProductionDeadlineTest
          --tests com.localagentbridge.android.runtime.AndroidProductionRuntimeChannelComposerTest
          --tests com.localagentbridge.android.runtime.AndroidProductionRuntimeActivationControllerTest
          --tests com.localagentbridge.android.runtime.RuntimeLocalStoreTest
          --tests com.localagentbridge.android.runtime.RuntimeClientViewModelTest
          --tests com.localagentbridge.android.runtime.RuntimeClientChatSessionMutationFailureTest
          --tests com.localagentbridge.android.runtime.RuntimeAttachmentPromptResourceTest
      - name: Bind and verify complete Android app units on main
        if: >-
          ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' }}
        run: |
          python3 -B script/check_product_ci.py --write-android-full-test-binding
          python3 -B script/check_product_ci.py --android-full-test-results
      - name: Compile and lint Android Release app
        run: >-
          ./gradlew
          --no-daemon
          --console=plain
          -PaetherlinkStrictReleaseDependencyLocks=true
          -Pkotlin.incremental=false
          :app:assembleRelease
          :app:bundleRelease
          :app:lintRelease
      - name: Read back Android Release build outputs
        run: >-
          python3 -B script/check_release_artifact_archive.py
          --android-build-outputs
